name: Import approved original Tale competition videos
on:
  push:
    paths:
      - .github/workflows/tales-approved-original-videos.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-approved-videos:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify the two user-approved original files
        run: |
          set -euo pipefail
          mkdir -p media
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 240 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-2cc0-81f5-aefc-0bcb53b7dd27/raw?se=2026-11-19T05%3A38%3A00Z&sp=r&sv=2026-06-06&sr=b&scid=9fae8dc3-1eed-5a94-9620-747149a6a00c&skoid=80e81ea6-3c08-46f9-bd84-b87176742bcd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-18T20%3A48%3A54Z&ske=2026-11-19T20%3A48%3A54Z&sks=b&skv=2026-06-06&sig=4TMrQG3qYzRstScT8UxKqeqXTNA/1mTu5V/Pf%2B9lWrE%3D' -o 'media/tales_competition_2018_original_full.mp4'
          echo "15df0e00e7d8058cfab6f9829be3af5e43f09b1d23224c9e511ee07e942044ee  media/tales_competition_2018_original_full.mp4" | sha256sum -c -
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 240 'https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-80f4-81fb-8f25-c87c07cc4d89/raw?se=2026-11-19T05%3A37%3A59Z&sp=r&sv=2026-06-06&sr=b&scid=a83108e3-deb1-5907-94ad-4b0734929ac5&skoid=80e81ea6-3c08-46f9-bd84-b87176742bcd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-18T20%3A47%3A03Z&ske=2026-11-19T20%3A47%3A03Z&sks=b&skv=2026-06-06&sig=3eo0Uof8cJVoFz2TB3cNnXauppCn2/wsMftg2RdfhkA%3D' -o 'media/tales_competition_2024_original_full.mp4'
          echo "6412ac793ac6e2b4d36bd9e362aeb1fffaf0a1d52ada4bfa53102d4bf7801a14  media/tales_competition_2024_original_full.mp4" | sha256sum -c -
      - name: Update only the two competition video sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          before={
              'https://outoftheboxmd-tales-approval-20261116.netlify.app/tales_original_competition_01.mp4':'./media/tales_competition_2018_original_full.mp4',
              'https://outoftheboxmd-tales-approval-20261116.netlify.app/tales_original_competition_02.mp4':'./media/tales_competition_2024_original_full.mp4'
          }
          for old,new in before.items():
              assert s.count(old) == 1, f'Unexpected count for {old}: {s.count(old)}'
              s=s.replace(old,new)
          assert all(s.count(new)==1 for new in before.values())
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit verified videos and HTML without other changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html media/tales_competition_2018_original_full.mp4 media/tales_competition_2024_original_full.mp4
          git diff --cached --quiet && exit 0
          git commit -m "Replace competition videos with approved full originals and original audio"
          git push origin HEAD:main
